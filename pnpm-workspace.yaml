packages:
  - 'packages/*'
  - 'apps/*'
  - 'tools/*'
  - 'examples/*'
  # The fixture project is a real project: it runs under Playwright Test, so it
  # needs its own node_modules like any other consumer would (T2.10).
  - 'evals/fixtures'

onlyBuiltDependencies:
  - esbuild

# One version of every shared tool across the workspace (LLD §1).
catalog:
  '@anthropic-ai/sdk': ^0.123.0
  '@eslint/js': ^9.17.0
  '@types/node': ^22.10.2
  '@typescript-eslint/utils': ^8.19.0
  eslint: ^9.17.0
  'eslint-plugin-import': ^2.31.0
  fastify: ^5.12.1
  '@fastify/websocket': ^11.3.0
  'eslint-import-resolver-typescript': ^4.4.5
  'node-html-parser': ^6.1.13
  peggy: ^5.1.0
  playwright: ^1.62.1
  '@playwright/test': ^1.62.1
  tsup: ^8.3.5
  typescript: ^5.7.2
  'typescript-eslint': ^8.19.0
  undici: ^7.16.0
  vitest: ^2.1.8
  yaml: ^2.6.1
  zod: ^3.24.1
  'zod-to-json-schema': ^3.24.1
