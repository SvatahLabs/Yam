name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # T3.4: the scheduled run is the one that spends. It measures grounding and the
  # model half of healing against the real gateway, and commits the answer cache
  # the pull-request job replays.
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # REQ-NFR-7: macOS, Linux and Windows on Node 22 LTS.
  NODE_VERSION: "22"

jobs:
  workspace:
    name: workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint (includes the LLD §1 import boundaries)
        run: pnpm lint

      - name: Licence check (REQ-PKG-3)
        run: pnpm check:licenses

      # T13.5: the generated reference pages cannot drift from the code.
      - name: Documentation is current
        run: pnpm docs:check

      # Phase 1 adapter and host tests drive a real browser (LLD §1). Only
      # chromium is required; `--with-deps` installs the system libraries the
      # Linux runner needs.
      # chromium for the Playwright adapter, firefox for the BiDi one: Gecko's
      # remote agent *is* a WebDriver BiDi server, so the independence proof
      # (T4.1) needs a browser that speaks the protocol natively (LLD §7.3).
      - name: Install browsers
        run: pnpm --filter @svatah/yam-adapter-playwright exec playwright install --with-deps chromium firefox

      # `--no-bail`: every package's tests run even after one fails, and the step
      # still fails if any did. Without it pnpm stops at the first failing
      # package, so a run showed one package's failures and hid the rest — on
      # the Windows runner that turned six independent defects into six runs.
      - name: Test
        if: runner.os != 'Linux'
        run: pnpm -r --no-bail test

      # The recorder's human gateway (REQ-REC-12) opens a headed browser for a
      # person to click in, and the Linux runner has no display: Chromium refused
      # with "Looks like you launched a headed browser without having a XServer
      # running". xvfb is on the runner already, so Linux runs the suite on a
      # virtual display, as the installer job's smoke check does.
      - name: Test (Linux, on a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm -r --no-bail test

      # T2.10's milestone: the four migrated fixtures against apps/sample-web,
      # four times, checking determinism (REQ-RUN-2), that both hosts agree
      # (REQ-BEH-5) and that two compiles are byte-identical (REQ-COMP-7). It
      # rewrites evals/conformance/runtime, and the diff check is what says the
      # committed fixture is still what a run produces.
      - name: Compatibility milestone (REQ-NFR-8)
        run: node scripts/compatibility.mjs

      - name: The conformance fixture is unchanged
        run: git diff --exit-code evals/conformance/runtime

      # T4.7: privacy mode. `pnpm -r test` already runs
      # `packages/cli/test/privacy.test.ts`; this runs the same claim as the
      # command `docs/privacy.md` tells a reader to run, so a failure here says
      # "a command reached the network" rather than "a test failed"
      # (REQ-NFR-3, REQ-RUN-1, REQ-NFR-1).
      - name: Privacy mode (REQ-NFR-3)
        run: node scripts/privacy-check.mjs

      # T10.4, Draft 2.12 §13.7: the component sheet's accessibility audit, with a
      # real axe-core beside it. axe-core is MPL-2.0 and REQ-PKG-3 admits MIT,
      # Apache-2.0 and BSD, so it is never a dependency — `scripts/fetch-axe.mjs`
      # downloads one pinned build into the system temporary directory at test
      # time, outside the dependency tree, and refuses anything whose SHA-256 is
      # not the recorded one. A rule axe reports and the audit does not is a
      # defect in the audit.
      - name: Component sheet accessibility (audit and axe-core)
        shell: bash
        run: node scripts/audit-sheet.mjs --axe "$(node scripts/fetch-axe.mjs)"

      # T5.6: the examples run. An example nobody runs is documentation that
      # drifts, and `examples/cron/book.sh` and `examples/mcp-agent/` are the
      # two that *can* run — the CI ones are workflow files for other people's
      # runners and are checked by being valid YAML.
      #
      # Ubuntu only: they drive the sample application and a browser, which the
      # matrix above has already exercised on all three platforms, and running
      # them everywhere would buy nothing but minutes.
      - name: The examples run (REQ-AGT-4)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm examples

  quick-start:
    name: quick start from a fresh checkout (REQ-PKG-2)
    runs-on: ubuntu-latest
    # T1.6 Validate: "quick start doc verified by a fresh-checkout CI job that
    # completes in under ten minutes". The job's own timeout is the outer bound;
    # `pnpm quick-start` measures the reader-facing steps and fails at ten
    # minutes on its own, so a slow runner and a slow quick start are told apart.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # chromium for the Playwright adapter, firefox for the BiDi one: Gecko's
      # remote agent *is* a WebDriver BiDi server, so the independence proof
      # (T4.1) needs a browser that speaks the protocol natively (LLD §7.3).
      - name: Install browsers
        run: pnpm --filter @svatah/yam-adapter-playwright exec playwright install --with-deps chromium firefox

      - name: Build
        run: pnpm -r build

      - name: Quick start (record, run, heal)
        run: pnpm quick-start

      - name: The recorded bindings match the committed ones
        run: git diff --exit-code examples/plain-playwright/bindings

  # T3.4: the grounding eval, twice over.
  #
  # On a pull request it replays answers a scheduled run committed under
  # `evals/grounding/cache` — a real measurement, re-checked at no cost, which is
  # what catches a change to the prompt, the pruning or the sample pages moving
  # the number. With no cache committed yet it falls back to the fake gateway,
  # which checks the harness and says so in its own report.
  grounding-eval:
    name: grounding eval (cached answers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      # chromium for the Playwright adapter, firefox for the BiDi one: Gecko's
      # remote agent *is* a WebDriver BiDi server, so the independence proof
      # (T4.1) needs a browser that speaks the protocol natively (LLD §7.3).
      - name: Install browsers
        run: pnpm --filter @svatah/yam-adapter-playwright exec playwright install --with-deps chromium firefox

      - name: Eval (REQ-REC-10)
        run: |
          if [ -d evals/grounding/cache ]; then
            node scripts/eval-grounding.mjs --cache evals/grounding/cache --report reports/eval-grounding.md
          else
            echo "No committed answer cache yet: checking the harness with the fake gateway."
            node scripts/eval-grounding.mjs --gateway fake --report reports/eval-grounding.md
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-grounding
          path: reports/eval-grounding.md

  # T3.4: the run that costs money, once a night, never on a pull request.
  #
  # It measures what REQ-REC-10 and REQ-HEAL-5 actually ask for — grounding
  # accuracy and healing with one model call — and writes the answer cache the
  # pull-request job replays for free. Skipped entirely when the repository has no
  # credential, rather than falling back to a fixture and calling it a measurement.
  model-evals:
    name: model evals (real gateway)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      # chromium for the Playwright adapter, firefox for the BiDi one: Gecko's
      # remote agent *is* a WebDriver BiDi server, so the independence proof
      # (T4.1) needs a browser that speaks the protocol natively (LLD §7.3).
      - name: Install browsers
        run: pnpm --filter @svatah/yam-adapter-playwright exec playwright install --with-deps chromium firefox

      - name: Skip without a credential
        id: credential
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "No ANTHROPIC_API_KEY: the model evals measure nothing without one."
            echo "have=false" >> "$GITHUB_OUTPUT"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Grounding eval (REQ-REC-10)
        if: steps.credential.outputs.have == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/eval-grounding.mjs --cache evals/grounding/cache --report reports/eval-grounding.md

      - name: Healing eval with one model call (REQ-HEAL-5)
        if: steps.credential.outputs.have == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/eval-healing.mjs --report reports/eval-healing.md

      - uses: actions/upload-artifact@v4
        if: always() && steps.credential.outputs.have == 'true'
        with:
          name: model-eval-reports
          path: reports/

  # The front door as a person uses it: the published MCP server, from npm, in an
  # empty directory (SF-07, REQ-PKG-2).
  #
  # Everything else here runs this checkout. The README's first command is
  # `npx -y @svatah/yam-mcp`, and the first time it was run from an empty
  # directory it could not open a browser: npx resolved a newer Playwright than
  # the browser `npx playwright install` had fetched. Nightly rather than per
  # push, because what it tests is the registry, which a commit does not change;
  # a failure here is a release that is broken for the people installing it.
  registry-mcp:
    name: the published MCP server, from npm
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npx @svatah/yam-mcp, doctor and one connect
        run: node scripts/registry-mcp-smoke.mjs --with-deps

  # T3.6: "installers build on three OSes."
  #
  # The app is an Electron application developed in this repository until its
  # first release (ADR-17), and `electron-forge make` is the only check that says
  # it can actually be shipped — a build that passes on a developer's machine and
  # cannot be packaged is a build nobody can install.
  app-installers:
    name: app installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The app spawns `yam serve`, so the CLI has to exist before it runs —
      # and the generated service client is written from the service's build.
      - name: Build the workspace
        run: pnpm -r build

      # The Debian maker needs dpkg and fakeroot; the smoke check needs a
      # display, which `xvfb` provides.
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg xvfb

      - name: Make
        run: pnpm --filter @svatah/yam-desktop make

      # T3.6's Validate item: the app opens a fixture project and shows
      # `GET /project` data, and quitting stops the service. Linux runners have
      # no display, so Electron gets a virtual one.
      #
      # T8.1: `make` has run, so `apps/desktop/out/` holds a packaged application and
      # this runs against *that* — with no `YAM_CLI`, so the app has to find
      # its own bundled CLI and resolve its own Node. Phase 7's smoke check
      # always launched the development Electron, which has the `RunAsNode` fuse
      # on and a CLI in the workspace, and so could not fail the way the product
      # failed. The line it prints says which target it used.
      # Electron on Linux sandboxes the app with `chrome-sandbox`, a helper that
      # has to be owned by root and setuid. The packager writes it as the
      # runner's user, and on GitHub's Ubuntu image Chromium cannot fall back to
      # unprivileged user namespaces, so the packaged app aborted with "The SUID
      # sandbox helper binary was found, but is not configured correctly". This
      # gives the helper the bits it needs rather than turning the sandbox off.
      - name: The packaged app's sandbox helper (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root apps/desktop/out/Yam-linux-x64/chrome-sandbox
          sudo chmod 4755 apps/desktop/out/Yam-linux-x64/chrome-sandbox

      - name: Smoke against the packaged app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm app:smoke

      - name: Smoke against the packaged app
        if: runner.os != 'Linux'
        run: pnpm app:smoke

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: apps/desktop/out/make/**
          if-no-files-found: error

  # T00: Yam drives the packaged Yam, and the suite is a gate (SF-18, SF-21).
  #
  # Wave 4 left this suite passing without passing *every* time — the outer
  # session would vanish with `SESSION_NOT_FOUND` around the moment the
  # application opened its own inner session — so it could not be a gate. Wave 5
  # root-caused that to two clients racing to start the machine's one session
  # holder, fixed it with an exclusive start lock and a liveness answer that
  # tells `busy` from `gone`, and then ran the suite ten times in a row: ten
  # identical counts, no failures.
  #
  # It runs behind the packaged build, because the whole point is that it drives
  # the thing a person installs rather than a renderer in a browser.
  #
  # **Exit 2 fails the leg.** It means the runner could reach nothing and the
  # suite did not run. That was tolerated while hosted macOS runners were
  # believed unable to grant Accessibility; they grant it (`ax/accessibility
  # granted` in this job's doctor step), and the suite reaches 118 of 119
  # checks here, so a 2 now is a regression in what Yam can reach — and a green
  # leg over a suite that never ran would hide exactly that. Exit 1 is a check
  # that failed, and fails the leg too.
  yam-on-yam:
    name: Yam drives the packaged Yam
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Browsers
        run: pnpm browsers

      - name: Build the workspace
        run: pnpm -r build

      # The application under test, and the copy of the command line staged
      # inside it. The suite checks that the staged copy speaks this build's
      # contract, because a stale bundle makes the application's own service
      # replace the session holder the suite is driving through — which reads
      # exactly like a defect in Yam and is a build that was not remade.
      - name: Package the app
        run: pnpm --filter @svatah/yam-desktop package

      - name: What this host can be asked
        run: node packages/cli/dist/bin.js surface doctor || true

      - name: Yam on Yam
        shell: bash
        run: |
          set +e
          YAM_ON_YAM_EVIDENCE_DIR=reports/yam-on-yam node evals/self/yam-on-yam/run.mjs
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            echo "::error::This runner could reach nothing (exit 2); the suite did not run."
          fi
          exit "$code"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yam-on-yam
          path: reports/yam-on-yam/**
          if-no-files-found: warn

  # T11.5: Yam verifies Yam, the two-sided parity gate (REQ-SELF-2, REQ-SELF-3,
  # LLD §13.9).
  #
  # `yam eval self` runs every check in `evals/self/checks.yaml` two ways — once
  # through Yam, once through an oracle that is not Yam (the app's Playwright
  # cases, vitest, a script's exit code) — and passes only when every check both
  # sides reached was answered the same way. Until now it had only ever been run
  # by hand, as `pnpm self`, on a developer's Mac.
  #
  # Nightly and on dispatch, never per push: it runs the Yam-on-Yam suite, the
  # live AX gate, the app's Playwright suite and the healing eval among its
  # sources, which is most of an hour on a hosted runner, and it has never run
  # here, so it must not block a push before it has been green.
  #
  # macOS, behind the packaged build, for the reasons `yam-on-yam` gives: the Yam
  # side drives the packaged app through the AX adapter.
  #
  # **It does not touch the committed reports.** `pnpm self` is `yam eval self
  # --update`, which rewrites `reports/self-parity.md` and the reports its
  # sources write; that is for a person refreshing the committed set. Here the
  # parity report goes to the runner's temporary directory and is uploaded, the
  # sources' reports go to a temporary directory of the command's own (P11-F3),
  # and a last step checks that `reports/` is exactly what was checked out.
  self-parity:
    name: Yam verifies Yam (self parity)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Browsers
        run: pnpm browsers

      - name: Build the workspace
        run: pnpm -r build

      # The Yam side and the app's Playwright side both drive the packaged app,
      # with the CLI staged inside it by the app's own `package` script.
      - name: Package the app
        run: pnpm --filter @svatah/yam-desktop package

      - name: What this host can be asked
        run: node packages/cli/dist/bin.js surface doctor || true

      # `evals/self`'s flows open the fixtures project through the app's Recent
      # list, which is empty on a runner nobody has opened a project on. This is
      # the first half of `pnpm self`; the second half is below, without
      # `--update`.
      - name: Put the fixtures project in the app's Recent list
        run: node scripts/seed-app-recents.mjs

      # Exit 1 is a disagreement: one oracle is wrong, and the report names both
      # pieces of evidence. Exit 0 with no check reached by both sides is not a
      # pass either — "100 percent agreement over 0 checks" is a gate that
      # compared nothing, which is what a runner that can reach neither side
      # would print — so that fails the leg too, saying so.
      - name: Self parity
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/self-parity"
          set +e
          node packages/cli/dist/bin.js eval self \
            --report "$RUNNER_TEMP/self-parity/self-parity.md" \
            | tee "$RUNNER_TEMP/self-parity/summary.txt"
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" = "1" ]; then
            echo "::error::Yam and an external oracle disagreed; the uploaded self-parity report names the checks and both answers."
          fi
          if [ "$code" = "0" ] && grep -q "agreement over 0 check(s)" "$RUNNER_TEMP/self-parity/summary.txt"; then
            echo "::error::No check was reached by both sides, so the parity gate compared nothing."
            code=1
          fi
          exit "$code"

      - name: The committed reports are untouched
        run: git diff --exit-code -- reports

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-parity
          path: ${{ runner.temp }}/self-parity/**
          if-no-files-found: warn

  # T6.1, T6.2: the desktop adapters against the app (REQ-ADP-6, 7, REQ-ADE-6).
  #
  # The only place either adapter can be *run*: the AX one needs macOS with the
  # Accessibility permission granted, the UIA one needs Windows. Everything below
  # the bridge is a pure function of a recorded tree and is covered by the
  # `workspace` job on every platform; this is the part that is not.
  #
  # Neither leg tolerates anything (T7.2).
  #
  # `scripts/desktop-conformance.mjs` says what happened in its exit code: **2**
  # is "the host is not ready", **1** is "this adapter is not conformant". Exit
  # 2 used to pass the leg with a warning, because GitHub's hosted macOS runners
  # were believed unable to grant the Accessibility permission. They grant it,
  # and both hosted legs report "conformant — 10 cases" — so a 2 now means the
  # gate silently stopped running, and it fails.
  #
  # Before that it was `continue-on-error: macos-latest`, which tolerated both —
  # so a macOS run that genuinely failed 0 of 7 would have been green, which is
  # exactly what Phase 6's live gate did (F1).
  desktop-conformance:
    name: desktop conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            adapter: uia
          - os: macos-latest
            adapter: ax
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the workspace
        run: pnpm -r build

      # The host requirement, first and on its own, so a failure here is
      # legible as "the runner cannot do this" rather than as a failed suite.
      - name: Host check
        run: node packages/cli/dist/bin.js surface doctor --adapter ${{ matrix.adapter }}

      # The conformance target is the app itself, packaged and launched with
      # `YAM_A11Y=1` (LLD §16, REQ-ADE-6). By the app's `package` script, which
      # stages the CLI that Forge copies into the app: `electron-forge package`
      # on its own fails on any checkout that has never staged one.
      - name: Package the app
        run: pnpm --filter @svatah/yam-desktop package

      # Exit 2 (host not ready) and exit 1 (not conformant) both fail the leg;
      # the first says which it was.
      - name: Conformance
        shell: bash
        run: |
          set +e
          node scripts/desktop-conformance.mjs \
            --adapter ${{ matrix.adapter }} \
            --report reports/adapter-${{ matrix.adapter }}.md
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            echo "::error::This runner could not host the ${{ matrix.adapter }} gate (exit 2); the suite did not run."
          fi
          exit "$code"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-conformance-${{ matrix.adapter }}
          # The report, and on Windows what the bridge saw (`YAM_UIA_TRACE`).
          path: |
            reports/adapter-${{ matrix.adapter }}.md
            reports/${{ matrix.adapter }}-trace-*.jsonl
          if-no-files-found: ignore

  # T23, SF-23: the Linux AT-SPI adapter against the app (REQ-ADP-7's Linux half).
  #
  # **Its first run is the first live run of the AT-SPI bridge anywhere.** The
  # adapter's role table, reference scope and refusals are pure functions of a
  # recorded tree and run in `workspace` on every push; the bridge — a `python3`
  # program over `pyatspi`, and `gdbus` for the bus — has never talked to a real
  # accessibility registry, and nor has the Linux half of
  # `scripts/desktop-conformance.mjs`. So this is nightly and on dispatch only,
  # its own job rather than a third leg of `desktop-conformance`, and it does
  # not block a push until it has been green. When it has, it belongs in that
  # matrix beside the other two.
  #
  # Exit 2 fails it all the same, as on the other two hosts: a leg that is green
  # because the host could not run the gate says nothing about the adapter.
  #
  # A hosted Ubuntu runner has no desktop session, so this builds the pieces one
  # would have given it: a virtual X display, a session D-Bus, toolkit
  # accessibility switched on, the accessibility bus that `org.a11y.Bus` hands
  # out, and `at-spi2-registryd` on it. Every step prints what answered, because
  # nobody has yet seen what a working one prints here.
  desktop-conformance-linux:
    name: desktop conformance (ubuntu, atspi)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # What the adapter needs, as its README and `surface doctor` name it:
      # `xvfb` for a display; `dbus-x11` for `dbus-launch`, a session bus that
      # outlives one step; `at-spi2-core` for the accessibility bus launcher and
      # the registry; `python3-pyatspi` and `gir1.2-atspi-2.0` for the walker the
      # bridge runs; `libglib2.0-bin` for `gdbus` and `gsettings`, with the GNOME
      # schema and the dconf backend so the accessibility setting is stored
      # somewhere a later process can read it. `libgtk-3-0` and
      # `libatk-bridge2.0-0` are what Electron's AT-SPI connection loads; apt
      # resolves both to their `t64` packages on Ubuntu 24.04.
      - name: The Linux accessibility stack
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb dbus-x11 at-spi2-core python3-pyatspi gir1.2-atspi-2.0 python3-gi \
            libglib2.0-bin gsettings-desktop-schemas dconf-gsettings-backend \
            libgtk-3-0 libatk-bridge2.0-0

      - name: Build the workspace
        run: pnpm -r build

      # The conformance target is the packaged app, launched with `YAM_A11Y=1`
      # (LLD §16, REQ-ADE-6), by the app's own script, which stages the CLI.
      - name: Package the app
        run: pnpm --filter @svatah/yam-desktop package

      # As in `app-installers`: on GitHub's Ubuntu image Chromium cannot fall back
      # to unprivileged user namespaces, so the sandbox helper has to be
      # root-owned and setuid or the packaged app aborts at once.
      - name: The packaged app's sandbox helper
        run: |
          sudo chown root:root apps/desktop/out/Yam-linux-x64/chrome-sandbox
          sudo chmod 4755 apps/desktop/out/Yam-linux-x64/chrome-sandbox

      # One display and one session bus for every step after this one, exported
      # through `GITHUB_ENV`. `xvfb-run` and `dbus-run-session` would each end
      # with the command they wrap, and the host check and the gate are separate
      # steps so that a failure reads as one or the other.
      #
      # Accessibility is switched on twice, because which one Chromium and the bus
      # launcher consult has not been seen here: GNOME's `toolkit-accessibility`
      # setting, and `org.a11y.Status.IsEnabled` on the bus itself. The gate adds
      # `ACCESSIBILITY_ENABLED=1` to the app's own environment as a third.
      # Setting `IsEnabled` also starts `at-spi-bus-launcher` through D-Bus
      # activation. The registry is started explicitly, and the step ends only
      # when `pyatspi` gets an answer from it.
      - name: A display, a session bus and the accessibility bus
        timeout-minutes: 5
        shell: bash
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          for attempt in $(seq 1 30); do
            [ -S /tmp/.X11-unix/X99 ] && break
            sleep 1
          done
          [ -S /tmp/.X11-unix/X99 ] || { echo "::error::Xvfb did not start"; cat "$RUNNER_TEMP/xvfb.log"; exit 1; }
          export DISPLAY=:99
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

          eval "$(dbus-launch --sh-syntax)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_PID=$DBUS_SESSION_BUS_PID" >> "$GITHUB_ENV"
          echo "session bus: $DBUS_SESSION_BUS_ADDRESS"

          gsettings set org.gnome.desktop.interface toolkit-accessibility true \
            || echo "::warning::gsettings could not turn toolkit-accessibility on; relying on org.a11y.Status"
          echo "toolkit-accessibility: $(gsettings get org.gnome.desktop.interface toolkit-accessibility || echo unreadable)"
          gdbus call --session --dest org.a11y.Bus --object-path /org/a11y/bus \
            --method org.freedesktop.DBus.Properties.Set org.a11y.Status IsEnabled '<true>'
          echo "accessibility bus: $(gdbus call --session --dest org.a11y.Bus --object-path /org/a11y/bus --method org.a11y.Bus.GetAddress)"

          registryd=""
          for candidate in /usr/libexec/at-spi2-registryd /usr/lib/at-spi2-core/at-spi2-registryd; do
            if [ -x "$candidate" ]; then registryd="$candidate"; break; fi
          done
          [ -n "$registryd" ] || { echo "::error::at-spi2-registryd is not installed where at-spi2-core puts it"; exit 1; }
          "$registryd" > "$RUNNER_TEMP/at-spi2-registryd.log" 2>&1 &

          echo "python3: $(command -v python3)"
          ready=no
          for attempt in $(seq 1 30); do
            if python3 -c 'import pyatspi; d = pyatspi.Registry.getDesktop(0); print("registry answered:", d.name, d.childCount, "application(s)")'; then
              ready=yes
              break
            fi
            sleep 1
          done
          [ "$ready" = "yes" ] || { echo "::error::The AT-SPI registry never answered pyatspi"; cat "$RUNNER_TEMP/at-spi2-registryd.log"; exit 1; }

      # The host requirement, first and on its own, as on the other two hosts.
      - name: Host check
        run: node packages/cli/dist/bin.js surface doctor --adapter atspi

      # Exit 2 (host not ready) and exit 1 (not conformant) both fail the leg;
      # the first says which it was.
      - name: Conformance
        timeout-minutes: 20
        shell: bash
        run: |
          set +e
          node scripts/desktop-conformance.mjs \
            --adapter atspi \
            --report reports/adapter-atspi.md
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            echo "::error::This runner could not host the atspi gate (exit 2); the suite did not run."
          fi
          exit "$code"

      # The report; what the app printed at each launch; the app's own
      # window-lifecycle log (`YAM_APP_DEBUG=1`, under its Linux user data
      # directory); and what Xvfb and the registry said. Everything a reader of
      # the first run will need and cannot ask the runner for afterwards.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-conformance-atspi
          path: |
            reports/adapter-atspi.md
            reports/atspi-app-*.log
            ~/.config/Yam/app-debug.log
            ${{ runner.temp }}/xvfb.log
            ${{ runner.temp }}/at-spi2-registryd.log
          if-no-files-found: ignore

  # T4.2, REQ-ADP-5: the Appium adapter against a real Android emulator, with
  # Android Chrome replaying the conformance subset `packages/adapter-appium`'s
  # README names ("The emulator gate").
  #
  # **It has never run live, here or anywhere.** Every unit test of the adapter
  # drives a fake device; what only a real driver can say is whether it accepts
  # these selectors and whether a real screen looks like the fixtures. Nightly
  # and on dispatch only, and not blocking a push, until it has been green.
  #
  # The pieces and why each is pinned or chosen:
  #
  #   * KVM, through the udev rule every emulator job on a hosted Ubuntu runner
  #     uses; without it the emulator falls back to software and does not boot
  #     inside the action's timeout.
  #   * `reactivecircus/android-emulator-runner`, API 34, x86_64, target
  #     `google_apis`. The AOSP `default` and the ATD images ship no Chrome; the
  #     Google APIs image ships it and is a debuggable build, which matters
  #     because ChromeDriver turns Chrome's first-run screens off through a
  #     command-line file that Chrome reads only on a debuggable build. The Play
  #     Store image also ships Chrome but is a production build.
  #     `scripts/appium-conformance.mjs` checks that Chrome is on the device
  #     before it runs anything, and names the target to change if it is not.
  #   * Appium 2 and the UiAutomator2 driver from npm, pinned: Appium 2.19.0 is
  #     the last 2.x, and UiAutomator2 driver 4.2.9 the last release whose peer
  #     range admits Appium 2 (5.x requires Appium 3). The adapter's probe says
  #     "Appium 2.x".
  #   * `--allow-insecure chromedriver_autodownload`, so Appium fetches the
  #     ChromeDriver that matches whatever Chrome the system image ships rather
  #     than this file pinning one to an image nobody here chose the Chrome of.
  #   * The sample application is served by the script on this runner's port
  #     4173, and the emulator reaches the runner's loopback as `10.0.2.2`.
  #   * `webdriverio` is a devDependency of `@svatah/yam-adapter-appium` in this
  #     workspace, so `pnpm install` is what provides it; the script checks it
  #     resolves from the adapter before it starts.
  appium-emulator:
    name: Android Chrome through Appium (emulator)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APPIUM_VERSION: "2.19.0"
      UIAUTOMATOR2_DRIVER_VERSION: "4.2.9"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the workspace
        run: pnpm -r build

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Appium and the UiAutomator2 driver
        timeout-minutes: 10
        run: |
          npm install -g "appium@${APPIUM_VERSION}"
          appium driver install --source=npm "appium-uiautomator2-driver@${UIAUTOMATOR2_DRIVER_VERSION}"
          appium --version
          appium driver list --installed

      # In the background for the rest of the job, before the emulator exists:
      # Appium does not need a device to start, and the script waits for its
      # `/status` rather than for a fixed time. Its log is uploaded below.
      - name: Start Appium
        run: |
          nohup appium --address 127.0.0.1 --port 4723 \
            --allow-insecure chromedriver_autodownload \
            --log-no-colors > "$RUNNER_TEMP/appium.log" 2>&1 &

      # The action boots the emulator, runs `script` while it is up, and shuts
      # it down. Each line of `script` is its own `sh -c`, so the exit-code
      # handling the other gates do over several lines is one line here: exit 2
      # (the device, Chrome, Appium or the sample application was not ready)
      # and exit 1 (not conformant) both fail the leg, and the first says which.
      - name: Emulator, and the conformance subset against it
        timeout-minutes: 60
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 6000M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            node scripts/appium-conformance.mjs --report reports/adapter-appium.md || { code=$?; if [ "$code" = "2" ]; then echo "::error::This runner could not host the Appium gate (exit 2); the suite did not run."; fi; exit "$code"; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-emulator
          path: |
            reports/adapter-appium.md
            ${{ runner.temp }}/appium.log
          if-no-files-found: ignore

  # T9.3: the generated clients, against a live service (REQ-SDK-1, REQ-SDK-2).
  #
  # `@svatah/yam-sdk`, `clients/python` and `clients/java` are generated from the
  # service's own OpenAPI description, so the thing worth running in CI is not
  # "do they compile" but "does a client that was generated last month still
  # talk to the service that is here today". Two checks:
  #
  #   * `pnpm clients:check` regenerates all three and diffs — a route the
  #     service renamed and nobody regenerated is a red build (LLD §13.8);
  #   * `pnpm clients:smoke` starts `yam serve` on a copy of the fixtures
  #     project and runs each smoke script against it: `GET /project`,
  #     `POST /run`, and the event stream, which is T9.3's Validate item.
  #
  # A toolchain that is missing is a *skip with the reason*, never a pass — so
  # the JDK and Python are installed here rather than being hoped for.
  clients-smoke:
    name: generated clients (python, java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      # The smoke runs a flow against the sample application, so it needs a
      # browser — the same chromium every other job installs.
      - name: Install browsers
        run: pnpm --filter @svatah/yam-adapter-playwright exec playwright install --with-deps chromium

      - name: The committed clients are what the description generates
        run: pnpm clients:check

      - name: Smoke (GET /project, POST /run, events)
        run: pnpm clients:smoke

  # T6.4: the foreign runtime against the published fixture (REQ-STD-3, LLD §14).
  #
  # Its own job because it is the one thing in this repository that must build
  # and run with *no* Node in the loop: a JDK, Maven Central, and the artifacts
  # this repository publishes. Node appears only to compile the plan and to serve
  # the sample application, which is what any third party would do.
  runtime-conformance:
    name: Java runtime conformance (REQ-STD-3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the workspace
        run: pnpm -r build

      # The sample application is served by the harness; Playwright for Java
      # brings its own driver but needs the browser's system libraries.
      - name: Install browsers
        run: pnpm --filter @svatah/yam-adapter-playwright exec playwright install --with-deps chromium

      - name: Build the Java runtime
        working-directory: runtimes/java
        run: ./gradlew --no-daemon fatJar test

      - name: Conformance (zero mismatches, or fail)
        run: node scripts/runtime-conformance.mjs --runtime java --report reports/runtime-java.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-conformance-java
          path: reports/runtime-java.md
          if-no-files-found: ignore

