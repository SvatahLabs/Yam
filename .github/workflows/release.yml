name: Release

# REQ-PKG-4: compiler, grounding, healing and adapter-conformance eval results are
# generated per release and published with the release notes.
#
# Every suite is runnable as of T4.4: healing (T1.8), grounding (T3.4), compiler
# (T4.3, T4.4) and adapter conformance (T4.1).
#
# Three of them need something a runner may not have, and each says so rather
# than guessing:
#
#   * grounding and healing-with-model need a credential. `ANTHROPIC_API_KEY` is
#     passed when the repository has one; without it the grounding report runs
#     against the fake gateway and says, at the top and in bold, that it measures
#     the harness rather than grounding, and the healing report says its 85%
#     number was not measured.
#   * the compiler's Tier 2 needs a local model server. `YAM_TIER2=1` turns it
#     on for a runner that has one; without it the report covers tiers 0 and 1,
#     which need no model at all, and names the tiers it covered.
#   * adapter conformance drives BiDi when a Gecko browser is installed —
#     `pnpm browsers` installs one — and records the adapter as skipped when not.
#
# A release that ships those ships an honest "not measured", never a number
# nobody took.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build the reports for"
        required: false
      publish:
        description: >-
          Publish the 35 packages of the release set to npm. Leave unchecked for a dry run that
          prints the exact commands and contacts no registry (T8.5).
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  eval-reports:
    name: Build and attach eval reports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      # The healing suite drives a real browser against `apps/sample-web` (T1.8).
      # chromium for the Playwright adapter, firefox for the BiDi one: Gecko's
      # remote agent *is* a WebDriver BiDi server, so the independence proof
      # (T4.1) needs a browser that speaks the protocol natively (LLD §7.3).
      - name: Install browsers
        run: pnpm --filter @svatah/yam-adapter-playwright exec playwright install --with-deps chromium firefox

      - name: Generate eval reports
        run: node scripts/eval-reports.mjs --out reports
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload eval reports as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: reports/

      - name: Attach eval reports to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: reports/*.md
          fail_on_unmatched_files: false

  # T7.6: the 0.1.0 release candidate's tarballs, and the promise they carry.
  #
  # It packs and it publishes nothing — "release candidate means packed
  # tarballs, a release workflow that stops at the artifact step, and a scripted
  # quick start; no registry publish". The quick start is the point: it installs
  # the module (a) tarballs into an empty Playwright project outside the
  # workspace and runs record, run and heal from them, which is the only way to
  # check what REQ-PKG-1 promises. A workspace hides every failure that matters
  # to it — a missing `files` entry, a `dist` nobody built, a `workspace:*` that
  # escaped into a tarball.
  #
  # Both Node LTS versions, because the contract names both (LLD §16), and with
  # no credential, because module (a) needs none.
  tarballs:
    name: pack and run the quick start from the tarballs (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Install browsers
        run: pnpm --filter @svatah/yam-adapter-playwright exec playwright install --with-deps chromium

      # Lists every tarball's contents and fails on a package that would ship
      # its tests, its build state, or a `workspace:` range.
      - name: Pack (no publish)
        run: pnpm release:dry-run

      # Installs them into an empty project, runs the quick start, and checks
      # the licences of what was installed (REQ-PKG-2, REQ-PKG-3).
      - name: The quick start, from the tarballs
        run: pnpm quick-start:packed --reuse

      - uses: actions/upload-artifact@v4
        with:
          name: tarballs-node-${{ matrix.node }}
          path: release/*.tgz
          if-no-files-found: error

      - name: Attach the tarballs to the release
        if: startsWith(github.ref, 'refs/tags/') && matrix.node == '22'
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.tgz
          fail_on_unmatched_files: false

  # T7.6: "a release workflow that builds the app installers on the three-OS
  # matrix". `ci.yml` builds them on every push to prove they *can* be built;
  # this one builds the ones a release ships and attaches them.
  #
  # ## Two Macs
  #
  # `macos-latest` is Apple silicon, so until this leg existed a release had
  # no build a person on an Intel Mac could open at all. The Intel build runs on
  # an Intel runner rather than being cross-built on the arm64 one: `make` stages
  # the CLI with `pnpm deploy`, which installs the prebuilt native binaries for
  # the machine it runs on, and a cross-build would ship arm64 ones inside an x64
  # app. `macos-15-intel` because `macos-13`, the older Intel label, was retired
  # in December 2025; GitHub has said this one is the last x86_64 image and
  # lasts until August 2027, and when it goes the Intel build goes with it.
  #
  # ## Signing
  #
  # Every leg makes installers with or without the signing secrets, and says
  # which it made. With none of them — a fork, or a repository that has not set
  # them up — the result is exactly what it was before signing existed.
  # `docs/project/signing.md` lists the secrets and what the owner creates.
  #
  # The secrets reach as few steps as they can: the certificate files only the
  # step that installs them, and the rest only `Make`, which is the step that
  # runs Forge. Each is further narrowed to the runner that uses it, so the Linux
  # leg never holds an Apple password. A job-level `env:` would have handed all
  # of them to `pnpm install`, and so to every install script in the tree.
  app-installers:
    name: app installers (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: windows-latest
            arch: x64
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The app spawns `yam serve`, so the CLI has to exist before it runs.
      - name: Build the workspace
        run: pnpm -r build

      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg xvfb

      # The Developer ID certificate, into a keychain that exists for this job.
      #
      # Not the runner's login keychain: a temporary one with a random password,
      # added to the search list so `codesign` (and appdmg, which cannot be told
      # a keychain) find the identity, and deleted at the end of the job. The
      # partition list lets `codesign` use the private key without the dialog
      # macOS would otherwise show to a machine nobody is sitting at.
      # `APPLE_KEYCHAIN` tells Forge which keychain to sign from.
      - name: Install the Developer ID certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_P12" ]; then
            echo "No APPLE_CERTIFICATE_P12 secret: nothing to install, and the macOS app will be unsigned."
            exit 0
          fi
          keychain="$RUNNER_TEMP/yam-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          certificate="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -f pkcs12 -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$certificate"
          echo "APPLE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$keychain"

      # The Authenticode certificate, as the PFX file @electron/windows-sign reads.
      - name: Install the Windows code-signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_P12: ${{ secrets.WINDOWS_CERTIFICATE_P12 }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_P12) {
            Write-Output "No WINDOWS_CERTIFICATE_P12 secret: nothing to install, and the Windows installer will be unsigned."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "windows-certificate.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_P12))
          "WINDOWS_CERTIFICATE_FILE=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # `forge.config.ts` decides from these, prints one line saying what it
      # decided, and treats an empty value as unset — which is what a secret the
      # repository does not have expands to. The API key arrives as the `.p8`
      # file's text and notarytool wants a path, so it is written out here.
      - name: Make
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_API_KEY_P8: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY_P8 || '' }}
          APPLE_API_KEY_ID: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
          fi
          unset APPLE_API_KEY_P8
          pnpm --filter @svatah/yam-desktop make

      # What was made, judged from the files rather than from which secrets were
      # set: a signing step that failed quietly would otherwise be reported as a
      # signed build. Written to the job summary as well as the log.
      - name: Signed or unsigned
        shell: bash
        run: |
          say() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          case "$RUNNER_OS" in
            macOS)
              app="$(ls -d apps/desktop/out/Yam-darwin-*/Yam.app | head -n 1)"
              # Captured, not piped into `grep -q`: under the runner's `pipefail`
              # a grep that exits at its first match can fail the pipeline.
              details="$(codesign -dv --verbose=2 "$app" 2>&1 || true)"
              if [[ "$details" == *"Authority=Developer ID Application"* ]]; then
                codesign --verify --deep --strict "$app"
                if xcrun stapler validate "$app" > /dev/null 2>&1; then
                  say "macOS ${{ matrix.arch }}: SIGNED with Developer ID and NOTARIZED (ticket stapled)."
                else
                  say "macOS ${{ matrix.arch }}: SIGNED with Developer ID but NOT notarized. Gatekeeper will refuse it."
                fi
              else
                say "macOS ${{ matrix.arch }}: UNSIGNED. Gatekeeper will refuse to open it until a person allows it in System Settings."
              fi
              ;;
            Windows)
              setup="$(ls apps/desktop/out/make/squirrel.windows/*/*Setup.exe | head -n 1)"
              status="$(pwsh -NoProfile -Command "(Get-AuthenticodeSignature -FilePath '$setup').Status")"
              if [ "$status" = "Valid" ]; then
                say "Windows: SIGNED ($(basename "$setup") has a valid Authenticode signature)."
              else
                say "Windows: UNSIGNED ($(basename "$setup"): $status). SmartScreen will warn before it runs."
              fi
              ;;
            *)
              say "Linux: the .deb and .zip are not signed; nothing here signs them."
              ;;
          esac

      # A hosted runner is discarded after the job, but a self-hosted one is not,
      # and a keychain holding a Developer ID key must not outlive the job that
      # needed it.
      - name: Remove the signing material
        if: always()
        shell: bash
        run: |
          if [ -n "${APPLE_KEYCHAIN:-}" ]; then security delete-keychain "$APPLE_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/windows-certificate.pfx" "$RUNNER_TEMP/developer-id.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: app-installers-${{ matrix.os }}-${{ matrix.arch }}
          path: apps/desktop/out/make/**
          if-no-files-found: error

      - name: Attach the installers to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/out/make/**/*
          fail_on_unmatched_files: false

  # T8.5: publish 0.1.0 — or say exactly what publishing would do.
  #
  # The dry run is the default and runs on every dispatch and every tag, because
  # a publish step nobody can run until the day it matters is a publish step
  # nobody has tested. `scripts/publish.mjs` refuses unless *all three* of
  # `--publish`, a `workflow_dispatch`, and `NPM_TOKEN` hold, so this job is the
  # rehearsal and the performance in one place and the guards do not live only
  # in this file.
  #
  # It needs the tarballs the `tarballs` job packed and quick-started, so it
  # waits for them and packs again in its own workspace: the artefact published
  # is the artefact that was checked, and both are produced by the same script
  # from the same commit.
  publish:
    name: publish to npm (dry run unless asked)
    needs: [tarballs, eval-reports, app-installers]
    runs-on: ubuntu-latest
    environment: release
    # Trusted publishing (T13.1): the job's OIDC token is the publish identity,
    # so once it is set up no long-lived token has to exist. It cannot be set up
    # before the first release, because npm registers a trusted publisher only on
    # a package that already exists. The first publish therefore goes out on
    # `NPM_TOKEN` below, which npm falls back to when the OIDC exchange fails, and
    # the secret can be deleted once every package trusts this workflow.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: pnpm install --frozen-lockfile

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships an older one.
      - name: npm that can publish with an OIDC identity
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Build
        run: pnpm -r build

      - name: Install browsers
        run: pnpm --filter @svatah/yam-adapter-playwright exec playwright install --with-deps chromium

      - name: Pack (no publish)
        run: pnpm release:dry-run

      # The same tarballs, installed into an empty project and driven, before
      # anything is published from them (REQ-PKG-2).
      - name: The quick start, from the tarballs
        run: pnpm quick-start:packed --reuse

      # Always. Prints the 35 exact `npm publish` commands and stops.
      - name: What publishing would run
        run: node scripts/publish.mjs

      # Only on a manual dispatch that asked for it, and only with an identity:
      # the job's OIDC token, or the secret as the fallback. `scripts/publish.mjs`
      # checks all of it again itself.
      - name: Publish
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: node scripts/publish.mjs --publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # And the one thing nobody can check before a publish (T12.5, REQ-PKG-2):
      # that the published versions install **by name**, with no overrides, out
      # of an empty project. A `workspace:*` that escaped into what was uploaded
      # fails here and nowhere else. Without a publish it runs in tarball mode
      # and says so, so the step is safe on every dispatch.
      - name: The quick start, from the registry
        run: pnpm quick-start:registry

      # The installers and the reports are attached by the jobs that produce
      # them — `app-installers` on its three-OS matrix, `eval-reports` and
      # `tarballs` on theirs — and this job waits for all three. Attaching them
      # again here would upload the same files twice from a job that does not
      # have them.
