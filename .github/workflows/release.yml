name: Release

# REQ-PKG-4: compiler, grounding, healing and adapter-conformance eval results are
# generated per release and published with the release notes.
#
# Phase 0 wires the workflow and the attach step. Each `svatah eval <suite>` command
# is added by the task that first makes that suite runnable (T1.8 healing, T3.4
# grounding and healing-with-model, T4.4 compiler); until then the step reports the
# suite as not yet runnable rather than failing the release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build the reports for"
        required: false

permissions:
  contents: write

jobs:
  eval-reports:
    name: Build and attach eval reports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Generate eval reports
        run: node scripts/eval-reports.mjs --out reports

      - name: Upload eval reports as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: reports/

      - name: Attach eval reports to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: reports/*.md
          fail_on_unmatched_files: false
