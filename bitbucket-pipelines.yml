# Bitbucket Pipelines — the workflow this repository actually runs.
#
# The repository's only remote is Bitbucket, so GitHub Actions has nowhere to
# run (Phase 0, K1). This file runs exactly the same steps as the Linux job of
# .github/workflows/ci.yml, on the same Node 22 LTS the GitHub matrix pins, in
# the same order, so the workflow is observable on the branch.
#
# Keep the two files in step: a step added here must be added there and the
# other way round. `tools/repo-checks/test/ci.test.ts` is what enforces it.
#
# ## The gates T7.2 added, and where each of them can run
#
# Phase 6's verification found that the GitHub workflow carried the desktop and
# Java conformance jobs and this file — the only one with a runner — carried
# neither, so both had never run (F8, K10). Three legs were added:
#
# | Gate | Runner | Status |
# |---|---|---|
# | Java runtime conformance | Bitbucket's hosted Linux | runs on every branch and pull request |
# | Windows UIA gate | self-hosted Windows | needs a runner attached |
# | macOS AX gate | self-hosted macOS with Accessibility granted | needs a runner attached |
#
# The two desktop legs live in a `custom:` pipeline rather than the default one
# on purpose. Bitbucket's hosted runners are Linux only; a step whose `runs-on`
# labels match no attached runner *queues* rather than failing, so putting them
# in the default pipeline would stall every branch build behind a runner that
# does not exist. `docs/spec/progress/phase-7.md` records which legs are blocked
# and why.
#
# The macOS leg tolerates exit 2 and nothing else. The gate script exits 2 for
# "this host cannot run me" and 1 for "this adapter is not conformant", and only
# the first is a runner's fault. A blanket `continue-on-error` would have made
# Phase 6's 0-of-7 macOS failure green.

image: node:22

definitions:
  caches:
    pnpm: $HOME/.local/share/pnpm/store
  steps:
    - step: &workspace
        name: workspace (linux, node 22)
        caches:
          - pnpm
        script:
          - corepack enable
          - corepack prepare --activate
          - node --version
          - pnpm --version
          - pnpm install --frozen-lockfile
          - pnpm -r build
          - pnpm -r typecheck
          # Includes the LLD §1 import boundaries.
          - pnpm lint
          # REQ-PKG-3.
          - pnpm check:licenses
          # Phase 1 adapter and host tests drive a real browser (LLD §1).
          # chromium for the Playwright adapter, firefox for the BiDi one (T4.1).
          - pnpm --filter @svatah/adapter-playwright exec playwright install --with-deps chromium firefox
          - pnpm -r test
          - node scripts/compatibility.mjs
          - git diff --exit-code evals/conformance/runtime
          # T4.7: privacy mode. A failure here says "a command reached the
          # network" (REQ-NFR-3, REQ-RUN-1, REQ-NFR-1).
          - node scripts/privacy-check.mjs
          # T5.6: the examples run. An example nobody runs is documentation that
          # drifts (REQ-AGT-4).
          - pnpm examples

    - step: &quick-start
        name: quick start from a fresh checkout (REQ-PKG-2)
        caches:
          - pnpm
        script:
          - corepack enable
          - corepack prepare --activate
          - pnpm install --frozen-lockfile
          # chromium for the Playwright adapter, firefox for the BiDi one (T4.1).
          - pnpm --filter @svatah/adapter-playwright exec playwright install --with-deps chromium firefox
          - pnpm -r build
          # T1.6 Validate: the quick start measures itself against a ten-minute
          # budget and fails if it is over (REQ-PKG-2).
          - pnpm quick-start
          - git diff --exit-code examples/plain-playwright/bindings

    - step: &runtime-conformance
        name: Java runtime conformance (REQ-STD-3, LLD §14)
        caches:
          - pnpm
        script:
          - corepack enable
          - corepack prepare --activate
          # The one gate here that must work with a JDK, Maven Central and the
          # artifacts this repository publishes — Node appears only to compile
          # the plan and serve the sample application, which is what any third
          # party would do.
          - apt-get update && apt-get install -y --no-install-recommends openjdk-17-jdk-headless
          - java -version
          - pnpm install --frozen-lockfile
          - pnpm -r build
          - pnpm --filter @svatah/adapter-playwright exec playwright install --with-deps chromium
          - cd runtimes/java && ./gradlew --no-daemon fatJar test && cd ../..
          # T7.4: this validates the runtime's own results.jsonl and summary.json
          # against the published schemas before it compares anything, and is a
          # gate — a mismatch or an invalid artifact exits non-zero.
          - node scripts/runtime-conformance.mjs --runtime java --report reports/runtime-java.md
        artifacts:
          - reports/runtime-java.md

    - step: &uia-gate
        name: desktop conformance (windows, uia)
        runs-on:
          - self.hosted
          - windows
        script:
          - corepack enable
          - corepack prepare --activate
          - pnpm install --frozen-lockfile
          - pnpm -r build
          # The host requirement first and on its own, so a failure reads as
          # "the runner cannot do this" rather than as a failed suite.
          - node packages/cli/dist/bin.js surface doctor --adapter uia
          - pnpm --filter @svatah/ade exec electron-forge package
          # No tolerance: UI Automation needs no permission grant, so there is
          # no "the runner could not" for this leg to hide behind.
          - node scripts/desktop-conformance.mjs --adapter uia --report reports/adapter-uia.md
        artifacts:
          - reports/adapter-uia.md

    - step: &ax-gate
        name: desktop conformance (macos, ax)
        runs-on:
          - self.hosted
          - macos
        script:
          - corepack enable
          - corepack prepare --activate
          - pnpm install --frozen-lockfile
          - pnpm -r build
          - node packages/cli/dist/bin.js surface doctor --adapter ax
          - pnpm --filter @svatah/ade exec electron-forge package
          # Exit 2 is "this host cannot grant the Accessibility permission" and
          # is tolerated with a message; exit 1 is "the adapter is not
          # conformant" and fails the leg. Never the other way round (T7.2).
          - |
            set +e
            node scripts/desktop-conformance.mjs --adapter ax --report reports/adapter-ax.md
            code=$?
            set -e
            if [ "$code" = "2" ]; then
              echo "This runner cannot host the ax gate (exit 2): the suite did not run."
              echo "Grant Accessibility to the runner's agent and it will."
              exit 0
            fi
            exit "$code"
        artifacts:
          - reports/adapter-ax.md

    - step: &release-candidate
        name: release candidate 0.1.0 — pack, quick start, reports (T7.6)
        caches:
          - pnpm
        script:
          - corepack enable
          - corepack prepare --activate
          - pnpm install --frozen-lockfile
          - pnpm -r build
          - pnpm --filter @svatah/adapter-playwright exec playwright install --with-deps chromium firefox
          # Packs, lists every tarball's contents, and fails on a package that
          # would ship its tests, its build state, or a `workspace:` range.
          - pnpm release:dry-run
          # Installs the module (a) tarballs into an empty Playwright project
          # outside the workspace and runs record, run and heal from them, then
          # checks the licences of what was installed (REQ-PKG-1, 2, 3).
          - pnpm quick-start:packed --reuse
          # REQ-PKG-4: the reports a release attaches.
          - node scripts/eval-reports.mjs --out reports
        # And it stops here. "Release candidate means packed tarballs, a release
        # workflow that stops at the artifact step, and a scripted quick start;
        # no registry publish." There is no `npm publish` in this file, and
        # adding one is a decision somebody makes on purpose.
        artifacts:
          - release/*.tgz
          - reports/*.md

    # T8.5: the publish, and the dry run that proves it without a token.
    #
    # One step, two modes. `scripts/publish.mjs` refuses unless all three of
    # `--publish`, a manual trigger and `NPM_TOKEN` hold, so the *same* step is
    # a safe rehearsal on any branch and the real thing only from the
    # `custom: publish` pipeline with the secret set. Splitting them into two
    # steps would mean the one that publishes had never been run.
    - step: &publish
        name: publish 0.1.0 — dry run unless triggered with a token (T8.5)
        caches:
          - pnpm
        script:
          - corepack enable
          - corepack prepare --activate
          - pnpm install --frozen-lockfile
          - pnpm -r build
          - pnpm --filter @svatah/adapter-playwright exec playwright install --with-deps chromium firefox
          # Everything the release candidate does, first: a publish of tarballs
          # that were not packed, quick-started and licence-checked in this same
          # job would be a publish of something nobody checked.
          - pnpm release:dry-run
          - pnpm quick-start:packed --reuse
          - node scripts/eval-reports.mjs --out reports
          # Prints the twenty-six exact `npm publish` commands. With no token and
          # no `SVATAH_PUBLISH_TRIGGER`, it prints them and stops, exit 0.
          - node scripts/publish.mjs
          # And the real thing. `SVATAH_PUBLISH_TRIGGER` and `NPM_TOKEN` are
          # supplied as *secured* pipeline variables by whoever triggers the
          # `publish` pipeline; on any other pipeline this exits 1 without
          # contacting a registry, which is what makes the line safe to leave in.
          - |
            if [ -n "$SVATAH_PUBLISH_TRIGGER" ] && [ -n "$NPM_TOKEN" ]; then
              node scripts/publish.mjs --publish
            else
              echo "publish: not triggered — the dry run above is the whole of this job."
            fi
        artifacts:
          - release/*.tgz
          - reports/*.md

    - step: &legacy-java
        name: legacy Java project compiles
        image: eclipse-temurin:17-jdk
        script:
          - cd legacy
          - ./gradlew --no-daemon compileJava

pipelines:
  default:
    - parallel:
        - step: *workspace
        - step: *quick-start
        - step: *runtime-conformance
        - step: *legacy-java
  branches:
    '**':
      - parallel:
          - step: *workspace
          - step: *quick-start
          - step: *runtime-conformance
          - step: *legacy-java
  pull-requests:
    '**':
      - parallel:
          - step: *workspace
          - step: *quick-start
          - step: *runtime-conformance
          - step: *legacy-java
  custom:
    # The two legs that need a runner this account does not have yet (T7.2).
    # Run from the Bitbucket UI once a self-hosted macOS or Windows runner is
    # attached with the labels above; they are here, definition and all, so that
    # attaching a runner is the only thing left to do.
    desktop-gates:
      - parallel:
          - step: *uia-gate
          - step: *ax-gate
    # T7.6, and the half of `.github/workflows/release.yml` that can run on the
    # remote this repository has. It packs, runs the quick start from what it
    # packed, writes the reports, and stops at the artifact step. The ADE
    # installers are the other half and need macOS and Windows runners, which is
    # the same blocked leg as `desktop-gates`.
    release:
      - step: *release-candidate
    # T8.5. The owner triggers this from the Bitbucket UI with `NPM_TOKEN` and
    # `SVATAH_PUBLISH_TRIGGER=manual` as secured variables; without them the same
    # step is a dry run that prints the commands and publishes nothing. The ADE
    # installers are attached by `.github/workflows/release.yml`, which is where
    # the macOS and Windows runners are.
    publish:
      - step: *publish
