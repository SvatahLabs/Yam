# Bitbucket Pipelines — the Linux job of .github/workflows/ci.yml.
#
# The repository's only remote is Bitbucket, so GitHub Actions has nowhere to
# run (Phase 0, K1). This file runs exactly the same seven steps on the same
# Node 22 LTS the GitHub matrix pins, in the same order, so the workflow is
# observable on the branch. macOS and Windows are not offered by Bitbucket's
# hosted runners; they stay covered by .github/workflows/ci.yml and remain
# unverified until a GitHub remote exists (REQ-NFR-7).
#
# Keep the two files in step: a step added here must be added there and the
# other way round.

image: node:22

definitions:
  caches:
    pnpm: $HOME/.local/share/pnpm/store
  steps:
    - step: &workspace
        name: workspace (linux, node 22)
        caches:
          - pnpm
        script:
          - corepack enable
          - corepack prepare --activate
          - node --version
          - pnpm --version
          - pnpm install --frozen-lockfile
          - pnpm -r build
          - pnpm -r typecheck
          # Includes the LLD §1 import boundaries.
          - pnpm lint
          # REQ-PKG-3.
          - pnpm check:licenses
          # Phase 1 adapter and host tests drive a real browser (LLD §1).
          # chromium for the Playwright adapter, firefox for the BiDi one (T4.1).
          - pnpm --filter @svatah/adapter-playwright exec playwright install --with-deps chromium firefox
          - pnpm -r test
          - node scripts/compatibility.mjs
          - git diff --exit-code evals/conformance/runtime
          # T4.7: privacy mode. A failure here says "a command reached the
          # network" (REQ-NFR-3, REQ-RUN-1, REQ-NFR-1).
          - node scripts/privacy-check.mjs

    - step: &quick-start
        name: quick start from a fresh checkout (REQ-PKG-2)
        caches:
          - pnpm
        script:
          - corepack enable
          - corepack prepare --activate
          - pnpm install --frozen-lockfile
          # chromium for the Playwright adapter, firefox for the BiDi one (T4.1).
          - pnpm --filter @svatah/adapter-playwright exec playwright install --with-deps chromium firefox
          - pnpm -r build
          # T1.6 Validate: the quick start measures itself against a ten-minute
          # budget and fails if it is over (REQ-PKG-2).
          - pnpm quick-start
          - git diff --exit-code examples/plain-playwright/bindings

    - step: &legacy-java
        name: legacy Java project compiles
        image: eclipse-temurin:17-jdk
        script:
          - cd legacy
          - ./gradlew --no-daemon compileJava

pipelines:
  default:
    - parallel:
        - step: *workspace
        - step: *quick-start
        - step: *legacy-java
  branches:
    '**':
      - parallel:
          - step: *workspace
          - step: *quick-start
          - step: *legacy-java
  pull-requests:
    '**':
      - parallel:
          - step: *workspace
          - step: *quick-start
          - step: *legacy-java
