# The check catalogue — Yam verifies Yam (T11.4, REQ-SELF-2, LLD §13.9).
#
# > The check catalogue `evals/self/checks.yaml` lists every check with an id, a
# > sentence, and two implementations: `yam` names a story in the self
# > project; `external` names the independent implementation (a Playwright case
# > over CDP, an osascript probe, a generated-client smoke, a pseudo-terminal
# > capture). Each side answers `pass`, `fail`, or `unreachable` with evidence;
# > `unreachable` says why (no adapter, no grant, no host).
#
# `yam eval self` runs both sides and compares them. It passes only at 100
# percent agreement over the checks both sides reach, and publishes the
# one-sided ones as **Yam's own shortcomings** — every one naming the adapter
# or the step Yam lacks, so the list can be read as a to-do rather than as an
# excuse.
#
# ## How to read a `yam.unreachable`
#
# It is never "this is hard". It is the sentence the flow language does not have
# or the surface Yam cannot open, said precisely enough that somebody could
# implement it.
#
# ## What Draft 2.15 closed, and what is left (T12.7)
#
# The Phase 11 list was thirty-six rows saying three things. Two of them are now
# sentences and the list is nineteen:
#
#   * **an assertion over a set** — "every control has an id", "no secret is
#     anywhere on this screen" — is **pattern 32**, and it closed eleven rows.
#   * **a window Yam cannot resize** is **pattern 33**, and it closed two.
#     `app.launch.size` is the initial size, `Resize the window to <w> by <h>`
#     the rest.
#   * **a chord sent to the window** turned out to be a sentence the language
#     already had (`Press "Meta+k"`, pattern 11 with no target) and an adapter
#     that could not send one. Four screens reached through the command palette
#     came back with it.
#
# What is left, and each row below says which it is:
#
#   * **a run inside a run** — the app's Run button starts a Yam run, and
#     pattern 19 can now wait on a service's answer, but the app's service
#     listens on a port it chose at start-up and an `api/` request names a URL.
#   * **a count** — pattern 32 quantifies (`Every`, `No`) and does not count, so
#     "each heading appears once" has no sentence.
#   * **geometry across elements** — pattern 24 asks about one element's box;
#     comparing two elements' boxes has no sentence.
#   * **a pseudo-terminal adapter**, which the surface kinds do not include.
#
# ## Three oracles stay external on purpose (REQ-SELF-3)
#
# The healing eval's ground-truth keys, axe-core on the component sheet, and the
# renderer-versus-adapter tree agreement. They sit below the surface Yam
# drives, and they are what keeps this gate from grading its own homework. They
# carry `externalByDesign`, and the report names them.

schemaVersion: "1.0.0"
checks:
  - id: "app.launch-open-read-quit"
    says: "Yam launches the packaged app, opens the fixtures project through its Recent list, reads the Flows toolbar, and quits it."
    yam:
      source: "yam"
      name: "the app opens a project, shows its flows, and quits"
    external:
      unreachable: "no Playwright case launches or quits the application: `_electron.launch` cannot open a packaged build with the `RunAsNode` fuse off (T8.1), so the app's own suite attaches to a build somebody else started. Launching and quitting is what T11.2 gave Yam and the external side does not have."
  - id: "app.screen-through-two-adapters"
    says: "The same flow drives the app's Flows screen through the accessibility tree and through the DOM over CDP."
    yam:
      source: "yam"
      name: "the app opens a project and shows its flows"
    external:
      source: "yam-cdp"
      name: "the app opens a project and shows its flows"
  - id: "gate.desktop-conformance"
    says: "The live macOS desktop conformance gate is conformant at app variants 0, 1 and 2."
    yam:
      unreachable: "the gate *is* Yam's surface conformance suite, driven by a script that launches three app variants and carries recorded fingerprints between them. A flow cannot relaunch its own application at a different variant mid-run: `app.launch` opens the session, and there is no sentence for a second one."
    external:
      source: "desktop-gate"
      name: "gate"
  # Two-sided since T22 (SF-22). The reason it was one-sided was that "driving a
  # terminal needs a pseudo-terminal adapter, and Yam has none" — which was true
  # of every wave up to this one. `packages/adapter-process` is that adapter, and
  # the Yam-on-Yam suite drives `yam ui --capture` through it and asserts the
  # Flows pane is on the screen. Ink asks whether its output is a terminal and
  # draws nothing when it is not, so a pane on the screen *is* the pseudo-terminal.
  - id: "cockpit.pseudo-terminal"
    says: "`yam ui` draws its panes in a real pseudo-terminal and its `--json` equals the model's state."
    yam:
      source: "yam-on-yam"
      name: "the cockpit draws its panes in the terminal"
    external:
      source: "tui-pty"
      name: "`yam ui` draws in a pseudo-terminal (T9.4) > opens on the `comp` run and draws its four panes"
  - id: "cockpit.json-is-the-model"
    says: "`yam ui --json` prints exactly what the screen model loads, ten times without a diff."
    yam:
      # Still one-sided, and for a reason T22 does *not* remove. Yam can now run
      # a command in a terminal and read its screen — but comparing `--json`
      # with the screen model ten times and diffing them is a program, not a
      # flow, and no sentence of the language says "run this twice and compare".
      unreachable: "Yam can drive a terminal since T22, and this still is not a flow: `yam ui --json` is the SDK's own answer and comparing it with the screen model ten times over is a program. What is missing is a sentence, not an adapter."
    external:
      source: "tui-pty"
      name: "`yam ui --json` is the model's state (T9.4, REQ-ADE-13) > prints the same Flows state ten times running (T10.4, P9-F4)"
  - id: "clients.generated-smoke"
    says: "The generated Python and Java clients drive the local service and agree with the TypeScript SDK."
    yam:
      unreachable: "an HTTP flow could call the service's routes, and it would be testing the *service* rather than the clients. What the smoke checks is that three generated clients agree, which is a comparison between programs and not something a flow observes."
    external:
      source: "client-smoke"
      name: "clients"
  - id: "design.artboards-fit"
    says: "Every artboard fits its own frame: one-row toolbars, a twelve-character title, an inspector that contains its contents."
    yam:
      unreachable: "the artboards are HTML files rendered headless, not an application with a window; there is nothing for a desktop adapter to attach to and no service for an HTTP one. A `web` flow could open them, and it would still need geometry assertions over sets (see the toolbar checks)."
    external:
      source: "artboards"
      name: "artboards"
  - id: "oracle.axe-sheet"
    says: "axe-core and the in-house audit both report zero violations on the component sheet."
    externalByDesign: "REQ-SELF-3. axe-core is a second implementation of the accessibility rules Yam's own audit implements; checking one with the other is the point, and checking either with Yam would be checking a thing with itself."
    yam:
      unreachable: "external by design (REQ-SELF-3)."
    external:
      source: "axe-sheet"
      name: "sheet"
  - id: "oracle.healing-ground-truth"
    says: "The healing eval recovers a degraded binding onto the element the ground-truth key names."
    externalByDesign: "REQ-SELF-3. The ground-truth key is stamped on the sample application *outside* the surface and `bindings.ignoreAttributes` removes it from synthesis, fingerprints and `native` \u2014 so nothing Yam can see may know the answer. A self flow that could read it would be the eval finding the answer in the answer key."
    yam:
      unreachable: "external by design (REQ-SELF-3)."
    external:
      source: "healing-eval"
      name: "healing"
  - id: "oracle.tree-agreement"
    says: "The app's renderer tree over CDP and its accessibility snapshot agree about every identified control's role and name."
    externalByDesign: "REQ-SELF-3. This is the check that the *adapter's picture of a window is the window*: its two sides are the DOM Chromium renders and the accessibility tree macOS publishes from it, and Yam is in neither. Every other check goes through something Yam wrote."
    yam:
      unreachable: "external by design (REQ-SELF-3)."
    external:
      source: "tree-agreement"
      name: "tree"
  - id: "app.surfaces-offers-a-connect-form-and-no-prose-intent"
    says: "Surfaces offers a connect form and no prose intent (T15, SF-12)"
    # Two-sided since T18. The reason this used to give — "driving Yam's own
    # Surfaces screen needs a second live surface session inside the one the
    # self suite is already driving with" — was true of the *flow language* and
    # was read as true of the product. `evals/self/yam-on-yam` opens exactly
    # that nested session, through `yam surface` and through the MCP tools.
    yam:
      source: "yam-on-yam"
      name: "the connect form offers a URL to fill"
    external:
      source: "app-playwright"
      name: "Surfaces offers a connect form and no prose intent (T15, SF-12)"
  - id: "app.opens-into-the-new-flows-screen-not-the-eleven-tabs"
    # Surface-first (T14): the app opens into Session, not Flows — Draft 2.27
    # merged Surfaces into it. Both sides
    # now drive the packaged application and ask the same question of it —
    # Yam's through `yam surface` and the MCP tools against the accessibility
    # tree and the renderer, Playwright's over CDP (T18, T20).
    says: "opens into Session by default, with the four-section rail (T14, SF-02, SF-16, REQ-ADE-14)"
    yam:
      source: "yam-on-yam"
      name: "the packaged application opens into Session"
    external:
      source: "app-playwright"
      name: "opens into Session by default, with the four-section rail (T14, SF-02, SF-16, REQ-ADE-14)"
  - id: "app.yam-drives-the-packaged-yam-end-to-end"
    says: "Yam drives the packaged Yam through its own public interfaces: connect to the sample app, select a control, fill it, and disconnect (T18, SF-21)."
    # The mission's own acceptance scenario 8. Its `yam` side is the journey
    # run through `yam surface` and the MCP tools, against the packaged
    # application's accessibility tree and its renderer; there is no external
    # implementation because a Playwright case driving the renderer by selector
    # is the thing this check exists to *not* be.
    yam:
      source: "yam-on-yam"
      name: "disconnecting returns the application to its connect form"
    external:
      unreachable: "an external oracle for this would be a Playwright case driving the app's renderer by selector — which is precisely what \"Yam controls Yam\" must not be reduced to. The independent oracles for this run are the screenshot, the geometry, the accessibility audit and the fixture project's bytes, and they are separate rows."

  - id: "app.every-interactive-control-on-the-flows-screen-is-named-and-i"
