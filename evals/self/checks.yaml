    says: "Run on the Flows screen starts a run and opens the Run screen"
    yam:
      unreachable: "pattern 19 now waits on a service's answer, so the *sentence* exists. What is missing is the request: the ADE's own service listens on a port it chose at start-up, and an `api/` request names a URL. A flow that could ask the ADE which port it is on would close this one."
    external:
      source: "ade-playwright"
      name: "Run on the Flows screen starts a run and opens the Run screen"
  - id: "ade.the-run-screen-shows-the-run-s-steps-audit-and-inspector"
    says: "the Run screen shows the run's steps, audit and inspector"
    yam:
      unreachable: "needs a run to read, and starting one means starting a Yam run from inside a Yam run: the click works, and what is missing is a sentence that waits for a *second* run to finish and reads its result. The screen itself is reachable and every control on it is bound."
    external:
      source: "ade-playwright"
      name: "the Run screen shows the run's steps, audit and inspector"
  - id: "ade.the-run-toolbar-keeps-its-buttons-on-one-line-however-long-t"
    says: "the Run toolbar keeps its buttons on one line, however long the title"
    yam:
      unreachable: "a *geometry* assertion \u2014 box heights and right edges across the toolbar's children. `Expect \u2026 to have size/location` exists for one element (pattern 24); comparing two elements' boxes does not."
    external:
      source: "ade-playwright"
      name: "the Run toolbar keeps its buttons on one line, however long the title"
  - id: "ade.the-inspector-says-each-of-its-headings-once"
    says: "the inspector says each of its headings once"
    yam:
      unreachable: "pattern 32 quantifies over a set \u2014 `Every`, `No` \u2014 and this needs a *count*: \"each heading appears once\" is a uniqueness claim, and neither quantifier can say it. An `Exactly one \u2026` or a `\u2026 should be unique` is the sentence that would close it."
    external:
      source: "ade-playwright"
      name: "the inspector says each of its headings once"
