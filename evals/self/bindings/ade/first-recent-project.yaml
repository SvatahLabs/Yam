# Seeded from an `automationId`, with no model and no recording (LLD §13.9).
#
# > Its bindings for the ADE are seeded from `automationId`s with no model and
# > no recording.
#
# The ADE's controls all carry an id that a rewording cannot break — the
# accessibility contract of LLD §13.7 requires one on every button, link, tab,
# field and row action, and the desktop snapshot case fails the live gate when
# one is missing. So a self-suite binding needs no grounding: the id *is* the
# answer, and writing it down by hand is more honest than recording a model's
# guess at it.
#
# `provenance.model: "none"` says exactly that, and it is what tells a reader of
# `svatah bindings show` that nothing was inferred here.
#
# ## The fingerprint is what a *seed* can honestly say
#
# A fingerprint is a recording of an element as it was, and nothing here has
# been recorded — so it carries the role and the id and nothing invented: no
# box a nobody measured, no neighbours nobody read. `verified: false` says the
# same thing in one word, and `svatah bindings verify` is what turns it true
# against a running ADE.
