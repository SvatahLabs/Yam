# Yam verifies Yam: the app, through the desktop adapters (T11.2, T11.4,
# REQ-SELF-1, LLD §13.9).
#
# > `evals/self/` is a Yam project: flows over the Playwright adapter against
# > `apps/sample-web`, over the AX and UIA adapters against the packaged app,
# > over the HTTP adapter against the local service, and over the SDK against
# > `yam ui --json`.
#
# This is the *desktop* half's configuration and it is the default, because it
# is the half that needs `app.launch` and `app.quit` — the others are selected
# with `--adapter` and their own `app` block by `yam eval self` (T11.5).
#
# ## Why the bundle and not the executable
#
# A GUI application forked from a process that is not in the user's Aqua session
# never attaches to the WindowServer: it runs, its renderer runs, and it has no
# window either the accessibility API or System Events can see, for ever
# (LLD §7.5, measured). `app.launch.bundle` is opened through LaunchServices,
# which places it in the session a person is looking at.
#
# ## Why the paths are relative to the repository
#
# This project is *of* this repository — the application it drives is the one
# this checkout builds — so a path that pointed anywhere else would be a suite
# about somebody else's app. `yam eval self` resolves them from the project
# directory.
schemaVersion: "1.0.0"
project: "yam-self"
environment: test
adapter: ax

app:
  processName: "Yam"
  launch:
    bundle: "../../apps/desktop/out/Yam-darwin-arm64/Yam.app"
    env:
      # The app is the desktop conformance target and an Electron application
      # publishes almost nothing to UIA or AX until it is told to (REQ-ADE-6).
      YAM_A11Y: "1"
      # The window-lifecycle log, so a launch that goes wrong says so in the
      # application's own words rather than only in a probe's (Draft 2.13).
      YAM_APP_DEBUG: "1"
      # A secret that is genuinely set, and a credential that genuinely exists
      # (T12.7, REQ-NFR-6). `data.yaml` holds the same two strings, so
      # `No text on this screen should contain {data.injected.password}` is a
      # question with an answer rather than a check over an unset variable.
      # Neither is a credential: they are nonsense chosen to be unmistakable in
      # a failure message, and the suite runs `--gateway fake` throughout.
      YAM_SAMPLE_PASSWORD: "not-a-real-password-8f21c4"
      ANTHROPIC_API_KEY: "sk-not-a-real-key-3d90ab"
    timeoutMs: 60000
    # The window's size, so a toolbar measured at 1440 points is measured at
    # 1440 points on somebody else's machine too (pattern 33, T12.7). The app
    # remembers its own size between runs, and a suite that did not name one was
    # reading whatever width the last person left it at.
    size: [1440, 900]
  quit:
    bundleId: "com.electron.yam"
    gracefulMs: 10000
    signalMs: 20000

flows: { dir: flows }
steps: { dir: steps }
bindings:
  dir: bindings
  testIdAttributes: ["data-testid", "data-test", "data-qa"]
data: { file: data.yaml }
api: { dir: api }

# The timeouts are a loaded machine's, not an idle one's.
#
# `yam eval self` runs this project *after* the healing eval — four minutes of
# Chromium — and beside whatever else the machine is doing, and a desktop
# adapter's locate is a fresh accessibility read of a thousand-node tree each
# time round. At five seconds a candidate, a click that the app answered a
# moment later than usual failed the step after it; measured on this host under
# the gate, and never on its own. Fifteen seconds is the same waiting a person
# does before deciding a screen did not open. Nothing here changes the product's
# defaults (`config.run` in LLD §4.2) — it is this project's own patience.
run:
  workers: 1
  headless: true
  stepTimeoutMs: 45000
  candidateTimeoutMs: 15000
  screenshots: onFailure
  trace: false
  outputDir: runs
  checkpoints: false
  audit: true

compile:
  confidenceThreshold: 0.8

record:
  model: "none"
  maxSnapshotTokens: 4000
  visionFallback: false

heal:
  onFail: false
  relocalizeThreshold: 0.72
  margin: 0.1
  useModel: false
