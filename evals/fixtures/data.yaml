# Nothing here is a secret in plain text: values under `secrets:` are read from
# the named environment variable at run time and are redacted everywhere —
# prompts, audit, results, traces and screenshots (REQ-NFR-6).

user:
  email: "connected2atul@gmail.com"
  password: "${YAM_SAMPLE_PASSWORD}"

card:
  number: "${YAM_SAMPLE_CARD_NUMBER}"
  cvv: "${YAM_SAMPLE_CARD_CVV}"

env: "test"
baseUrl: "http://localhost:4173"
date: "2026-09-03"
reportPath: "reports/summary.pdf"

secrets:
  - user.password
  - card.number
  - card.cvv
